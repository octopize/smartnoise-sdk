[tool.poetry]
name = "smartnoise-synth"
version = "1.0.8"
description = "Differentially Private Synthetic Data"
authors = ["SmartNoise Team <smartnoise@opendp.org>"]
license = "MIT"
packages = [{include="snsynth"}]
homepage = "https://smartnoise.org"
repository = "https://github.com/opendp/smartnoise-sdk"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
opacus = {version="^0.14.0", optional=true}
torch = {version = ">=2.2.0", optional = true}
pac-synth = {version = "^0.0.8", optional = true}
smartnoise-sql = ">=1.0.10"
Faker = ">=17.0.0"
mbi = ">=1.1.0,<2"
disjoint-set = "^0.9.0"

[tool.poetry.extras]
pacsynth = ["pac-synth"]

[tool.poetry.extras]
pacsynth = ["pac-synth"]

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
